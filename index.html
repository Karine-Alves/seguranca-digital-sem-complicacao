<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segurança Digital Sem Complicação</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eef5fb;
      color: #102033;
    }

    header {
      background-color: #061a33;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 10px;
      font-size: 17px;
    }

    main {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #c9d9e8;
    }

    h2 {
      color: #06345c;
      margin-top: 0;
    }

    button {
      background-color: #06345c;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 0 18px 0;
      font-size: 15px;
    }

    button:hover {
      background-color: #0b5f8a;
    }

    #mensagem {
      font-weight: bold;
      color: #06345c;
    }

    iframe {
      width: 100%;
      height: 750px;
      border: 1px solid #c9d9e8;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #40556b;
    }
  </style>
</head>

<body>
  <header>
    <h1>Segurança Digital Sem Complicação</h1>
    <p>Projeto de Atividade Extensionista II</p>
  </header>

  <main>
    <section>
      <h2>Meu ebook</h2>

      <p>
        Esse é o ebook que fiz para o projeto. Ele traz dicas simples sobre
        segurança digital e cuidados para evitar golpes na internet.
      </p>

      <button onclick="mostrarMensagem()">Clique para ver uma dica</button>

      <p id="mensagem"></p>

      <iframe
        src="ebook.pdf"
        title="Ebook Segurança Digital Sem Complicação">
      </iframe>
    </section>
  </main>

  <footer>
    <p>Autora: Karine Alves</p>
  </footer>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").innerText =
        "Dica: nunca compartilhe senhas ou códigos recebidos por mensagem.";
    }
  </script>
</body>
</html>
